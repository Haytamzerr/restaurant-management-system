{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<h1>Customers</h1>
<form class="card inline" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="name" placeholder="Name" required>
  <input name="phone" placeholder="Phone">
  <button class="btn small">Add customer</button>
</form>
<table>
  <tr><th>Name</th><th>Phone</th><th>Orders</th><th>Spent (paid)</th><th>Since</th></tr>
  {% for c in customers %}
  <tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.orders }}</td><td>{{ c.spent | money }}</td><td>{{ c.created_at[:10] }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
