{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<form class="card narrow" method="post">
  <h1>Change password</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Current password <input name="current" type="password" required></label>
  <label>New password (8+ characters) <input name="new" type="password" minlength="8" required></label>
  <button class="btn">Save</button>
</form>
{% endblock %}
